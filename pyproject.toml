[build-system]
requires = ["uv-build==0.11.22"]
build-backend = "uv_build"

[project]
name = "harnessbuddy"
version = "0.1.0"
description = "Prepare software libraries for reproducible OSS-Fuzz project generation."
requires-python = ">=3.13"
dependencies = []

[project.scripts]
harnessbuddy = "harnessbuddy.__main__:main"

[dependency-groups]
dev = [
    "pytest==9.1.0",
    "ruff==0.15.18",
    "ty==0.0.50",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "agentic: invokes a live LLM agent subprocess (claude/codex); slow, requires agent CLI auth",
    "build_matrix: clones and builds every library in the LIBS matrix; slow, network-heavy",
]
addopts = ["-m", "not agentic and not build_matrix"]

[tool.ruff]
line-length = 100
target-version = "py313"
exclude = [".devcontainer"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "ARG", "SIM", "C4", "RUF", "C90", "PLR0913"]

[tool.ruff.lint.mccabe]
max-complexity = 8
