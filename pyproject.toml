[build-system]
requires = ["uv-build==0.11.22"]
build-backend = "uv_build"

[project]
name = "harnessbuddy"
version = "0.1.0"
description = "Prepare software libraries for reproducible OSS-Fuzz project generation."
requires-python = ">=3.13"
dependencies = ["pyyaml>=6.0"]

[project.scripts]
harnessbuddy = "harnessbuddy.__main__:main"

[dependency-groups]
dev = [
    "pytest==9.1.0",
    "ruff==0.15.18",
    "ty==0.0.50",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "agentic: the opt-in matrix of libraries whose deterministic build is expected to fail, so the run turns on repair. Note that 'smoke' also invokes agents; this marker selects the extra libraries, not the only ones that use an agent.",
    "build_matrix: clones and builds a real library from the LIBS matrix; slow, network-heavy, requires cmake/make/autotools/meson on PATH depending on the library. Only the 'smoke' subset of this runs by default; the rest is opt-in via `-m build_matrix`.",
    "smoke: the small subset of build_matrix that runs by default (pytest -q). It spans both lanes deliberately, so it invokes a live LLM agent (requires agent CLI auth) and needs a Docker daemon for the OssFuzzExecutor libraries.",
    "docker: requires a running Docker daemon (OssFuzzExecutor); slow, network-heavy. Some 'smoke' tests also need Docker without carrying this marker, since they run by default.",
]
addopts = ["-m", "not agentic and not docker and not (build_matrix and not smoke)"]

[tool.ruff]
line-length = 100
target-version = "py313"
exclude = [".devcontainer"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "ARG", "SIM", "C4", "RUF", "C90", "PLR0913"]

[tool.ruff.lint.mccabe]
max-complexity = 8
