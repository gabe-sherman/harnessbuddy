[build-system]
requires = ["uv-build==0.11.24"]
build-backend = "uv_build"

[project]
name = "harnessbuddy"
version = "0.1.0"
description = "Prepare software libraries for reproducible OSS-Fuzz project generation."
requires-python = ">=3.13"
dependencies = []

[project.scripts]
harnessbuddy = "harnessbuddy.__main__:main"

[dependency-groups]
dev = [
    "pytest==9.1.1",
    "ruff==0.15.20",
    "ty==0.0.54",
]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py313"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "ARG", "SIM", "C4", "RUF"]
